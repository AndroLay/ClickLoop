name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MinGW windres on PATH
        run: |
          $candidates = @(
            "C:\msys64\ucrt64\bin",
            "C:\msys64\mingw64\bin",
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          )
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir "windres.exe")) {
              Add-Content -Path $env:GITHUB_PATH -Value $dir
              Write-Host "Using windres from $dir"
              break
            }
          }

      - name: Install Rust GNU toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --component clippy,rustfmt
          rustup default stable-x86_64-pc-windows-gnu

      - name: Verify, build & package
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release
          cargo fmt --manifest-path installer/Cargo.toml --check
          cargo clippy --manifest-path installer/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path installer/Cargo.toml
          .\scripts\build-installer.ps1 -SkipAppBuild

      - name: Generate SHA256SUMS.txt
        run: |
          $lines = Get-ChildItem dist\*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [IO.File]::WriteAllLines((Resolve-Path dist).Path + "\SHA256SUMS.txt", $lines, (New-Object Text.UTF8Encoding($false)))
          Get-Content dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $sums = Get-Content dist\SHA256SUMS.txt -Raw
          $notes = @"
          ## ClickLoop $tag

          Built transparently via GitHub Actions from pure Rust source code (zero external crates, GPL-3.0).

          ### Downloads
          - **ClickLoop-Setup.exe** (recommended): Standalone Windows installer + uninstaller (no Administrator rights required).
          - **clickloop.exe**: Portable single-file executable.
          - **SHA256SUMS.txt**: SHA-256 verification checksums.

          ### SHA-256 Checksums
          ``````text
          $($sums.Trim())
          ``````
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [IO.File]::WriteAllText($notesFile, $notes, (New-Object Text.UTF8Encoding($false)))
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\ClickLoop-Setup.exe dist\clickloop.exe dist\SHA256SUMS.txt --clobber
            gh release edit $tag --notes-file $notesFile
          } else {
            gh release create $tag dist\ClickLoop-Setup.exe dist\clickloop.exe dist\SHA256SUMS.txt --title "ClickLoop $tag" --notes-file $notesFile
          }
