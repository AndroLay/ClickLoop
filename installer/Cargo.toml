[package]
name = "clickloop-installer"
version = "1.0.0"
edition = "2021"
description = "Standalone Windows installer and uninstaller for ClickLoop"
license = "MIT"

[[bin]]
name = "ClickLoop-Setup"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
